<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Builds</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body class="deep">
    <!-- The pop-out (plugin.js opens it): the whole build, drawn from the
         same data and code as the panel. Drag it by its header. -->
    <div class="frame">
      <header class="bar">
        <span class="title">Builds</span>
        <div class="tabs" role="tablist" aria-label="Show">
          <button type="button" data-tab="build" role="tab" aria-selected="true">Builds</button>
          <button type="button" data-tab="guide" role="tab" aria-selected="false">Guide</button>
        </div>
        <div class="chips classes" role="group" aria-label="Class"></div>
        <div class="modes" role="group" aria-label="Build">
          <button type="button" data-mode="pve" aria-pressed="true">PvE</button>
          <button type="button" data-mode="pvp" aria-pressed="false">PvP</button>
          <button type="button" data-mode="compare" aria-pressed="false" title="PvE and PvP side by side">Both</button>
        </div>
        <div class="tools">
          <button type="button" class="textBtn" data-text="-1" title="Smaller text">A−</button>
          <button type="button" class="textBtn" data-text="1" title="Bigger text">A+</button>
          <button type="button" class="sizeBtn" data-step="-1" title="Smaller window">−</button>
          <button type="button" class="sizeBtn" data-step="1" title="Bigger window">+</button>
          <button type="button" class="closeBtn" title="Close (the panel's Pop out opens it again)">✕</button>
        </div>
      </header>
      <main class="build grid"></main>
      <main class="guide" hidden></main>
    </div>
    <script src="/_sdk/a2.js"></script>
    <script src="builds.js"></script>
    <script src="play.js"></script>
    <script src="boards.js"></script>
    <script src="ariel.js"></script>
    <script src="planner.js"></script>
    <script src="progression.js"></script>
    <script src="guide.js"></script>
    <script src="guideview.js"></script>
    <script src="playview.js"></script>
    <script src="view.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
