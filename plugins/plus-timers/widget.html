<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Event Timers pin</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <!-- The icons, as page images: on Linux the meter puts a page's images
         into it, and WebKitGTK refuses any file the page asks for later, so
         an icon set from the script stayed empty. -->
    <div class="icons" hidden>
      <img data-icon="boss" src="icons/boss.png" alt="" />
      <img data-icon="shugo" src="icons/shugo.png" alt="" />
      <img data-icon="invasion" src="icons/invasion.png" alt="" />
      <img data-icon="rift" src="icons/rift.png" alt="" />
      <img data-icon="artifact" src="icons/artifact.png" alt="" />
    </div>
    <!-- An alert as a banner (plus.js): its own window in a corner of the
         screen, so the alert neither opens the meter's panel nor takes focus. -->
    <div class="banner" hidden>
      <div class="bannerHead">World Timers<button class="bannerClose" type="button" title="Close" aria-label="Close">×</button></div>
      <div class="bannerLines"></div>
      <div class="bannerDecay"></div>
    </div>
    <!-- The rift card (rift.js): the Spacetime Rift's countdown. -->
    <div class="riftCard" hidden>
      <img class="riftArt" src="icons/rift.png" alt="" />
      <div class="riftBody">
        <div class="riftHead"><span class="riftName"></span><span class="riftBadge" hidden></span></div>
        <div class="riftTime"></div>
        <div class="riftAt"></div>
        <div class="riftLater"></div>
      </div>
      <button class="riftClose" type="button" title="Turn the rift card off" aria-label="Close">×</button>
      <div class="riftBar"><div class="riftFill"></div></div>
    </div>
    <div class="pin">
      <div class="badge"><img class="art" alt="" hidden /><span class="glyph"></span></div>
      <div class="time"></div>
      <div class="sub"></div>
      <div class="name"></div>
    </div>
    <script src="/_sdk/a2.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
