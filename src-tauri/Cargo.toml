[package]
name = "citizen-score"
version = "2.0.70"
description = "Citizen Score - AION 2 real-time DPS overlay"
authors = ["taengu", "pbodds"]
edition = "2024"
# Required because this crate declares more than one binary: without it
# `cargo run` (and therefore `npm run tauri dev`) cannot tell which one is the
# app and refuses to start.
default-run = "citizen-score"

[lib]
name = "citizen_score_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Everything that cannot exist on wasm32. The parser core is deliberately not in
# here: the log service re-derives an uploaded fight by compiling this crate to
# `wasm32-unknown-unknown` and running the same parser the client ran, so a
# dependency creeping across this line breaks that guarantee.
#
#   cargo check --no-default-features --target wasm32-unknown-unknown
#
# is the check that enforces it.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:libloading",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:flate2",
    "dep:zstd",
    "dep:getrandom",
    # Linux only (see the target section below); ignored elsewhere.
    "dep:gtk",
    "dep:webkit2gtk",
    "dep:x11-dl",
    "dep:libc",
    "dep:zbus",
]

# Every binary is declared rather than left to auto-discovery, so adding one
# cannot quietly change which target `tauri build` bundles.
[[bin]]
name = "citizen-score"
path = "src/main.rs"
required-features = ["desktop"]

# Linux global hotkeys, in a process without the meter's capture permission
# (platform::linux::hotkeys). Packaged next to the meter, never given caps.
[[bin]]
name = "citizen-score-hotkeys"
path = "tools/hotkeys_helper.rs"
required-features = ["desktop"]

# A workbench for reversing packet structure (developer tool).
[[bin]]
name = "cs-probe"
path = "tools/cs_probe.rs"
required-features = ["desktop"]

# Reads an Evidence Slice back and prints what is in it (docs/PRIVACY.md).
# Kept outside src/bin/, which .gitignore excludes for scratch debug binaries.
[[bin]]
name = "cs-inspect"
path = "tools/cs_inspect.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = { version = "0.8", optional = true }
lz4_flex = "0.11"
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
# The stream overlay's key (see stream_overlay/) and each Evidence Slice's key.
# Already in the tree through Tauri; named here for the OS random source it wraps.
getrandom = { version = "0.3", optional = true }
sha2 = "0.11.0"
flate2 = { version = "1.1.10", optional = true }
# Evidence slices are compressed with zstd (share::compress_slice); the log
# service reads it with a pure-Rust decoder.
zstd = { version = "0.13", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    # DPAPI, for encrypting the account token at rest.
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    # Npcap's folder on the DLL search path (SetDllDirectoryW).
    "Win32_System_LibraryLoader",
    # ShellExecuteExW, to run Npcap's installer elevated (its struct needs HKEY).
    "Win32_System_Registry",
    # Screenshots: the folder picker (IFileOpenDialog) and the Pictures folder.
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

# Desktop-only, so optional and enabled by `desktop`: the parser core builds
# without them (see the wasm32 check in CI).
[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency tree; use its Linux permission and ACL bindings.
libc = { version = "0.2", optional = true }
# Native dialogs (errors). The same GTK Tauri runs on.
gtk = { version = "0.18", optional = true }
# Screenshots: WebKit's snapshot of the meter's page. Same version and feature
# as Tauri's own, so it is the one copy.
webkit2gtk = { version = "2", features = ["v2_40"], optional = true }
# The pointer's position under XWayland, for the click-through lock. Loads
# libX11 at run time; already in the tree through tao.
x11-dl = { version = "2.21", optional = true }
# Global hotkeys through the GlobalShortcuts portal (D-Bus). The zbus the
# opener plugin already brings in, so no second D-Bus stack.
zbus = { version = "5", optional = true }

[dev-dependencies]
flate2 = "1"
zstd = { version = "0.13", default-features = false }
# The log service's pure-Rust zstd decoder, to check it reads what the meter writes.
ruzstd = "0.7"

# Citizen Score: what the downloads are built with. One codegen unit and thin
# LTO let the optimiser see across crates (the parser's hot loops call into
# several); stripping symbols takes the binary from ~32 MB to ~22 MB.
# Panics still unwind, so a crashed worker thread is logged rather than taking
# the meter down.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
